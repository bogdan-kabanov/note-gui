# Сборка Windows-релиза по тегу vX.Y.Z.
# Нужен runner с тегом windows, Rust, Node.js и Visual Studio Build Tools.
# Секреты: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# Если CI_JOB_TOKEN не может создавать релизы, задайте GITLAB_TOKEN.

stages:
  - release

release_windows:
  stage: release
  tags:
    - windows
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/gitlab_release.ps1
